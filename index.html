<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e5dbc3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#252a20" media="(prefers-color-scheme: dark)">
  <style>html { background: #f6e7c8; color-scheme: light dark; } @media (prefers-color-scheme: dark) { html { background: #252a20; } }</style>
  <meta name="description" content="Uma experiência interativa de álbum em CD.">
  <title>Two Of Us — álbum interativo</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <!-- Bump this shared release token for the stylesheet and all four scripts. -->
  <link rel="stylesheet" href="css/style.css?v=20261017-tracklist-1">
  <link rel="preload" href="assets/img/cover-front.webp" as="image" fetchpriority="low">
  <script defer src="js/data.js?v=20261017-tracklist-1"></script>
  <script defer src="js/player.js?v=20261017-tracklist-1"></script>
  <script defer src="js/booklet.js?v=20261017-tracklist-1"></script>
  <script defer src="js/app.js?v=20261017-tracklist-1"></script>
</head>
<body class="headphones-pending">
  <section id="headphones-gate" class="headphones-gate" aria-labelledby="headphones-title" aria-describedby="headphones-copy">
    <div class="headphones-notice">
      <svg class="headphones-icon" viewBox="0 0 160 180" fill="none" aria-hidden="true" focusable="false">
        <path d="M46 27c-11-5-22 2-23 13-1 10 7 19 16 18 7-1 9-8 12-13l5-6c3-5-3-10-10-12Z"/>
        <path d="M43 29c-7-2-13 2-14 9s4 13 10 13c4 0 6-4 8-8M31 35l9 6M30 41l8 5M39 58c-3 18-1 35 12 45 9 7 21 12 29 28"/>
        <path d="M114 27c11-5 22 2 23 13 1 10-7 19-16 18-7-1-9-8-12-13l-5-6c-3-5 3-10 10-12Z"/>
        <path d="M117 29c7-2 13 2 14 9s-4 13-10 13c-4 0-6-4-8-8M129 35l-9 6M130 41l-8 5M121 58c3 18 1 35-12 45-9 7-21 12-29 28M80 131c0 13-5 22-2 34"/>
        <path d="M77 129h6v9h-6zM78 165v6"/>
      </svg>
      <h2 id="headphones-title">Coloque os fones de ouvido</h2>
      <p id="headphones-copy">A melhor experiência é com fones. Vale esperar um segundo para colocá-los.</p>
      <button id="headphones-continue" type="button">Estou pronta</button>
    </div>
  </section>
  <main class="experience" id="experience" inert aria-hidden="true">
    <header class="album-heading open-only" aria-hidden="true">
      <div class="eyebrow"><span>VOL. 01</span></div>
      <h1 id="album-title"><button id="polaroid-trigger" type="button" aria-label="Ver detalhes do disco" aria-haspopup="dialog" aria-controls="polaroid-dialog" tabindex="-1" disabled><img width="1352" height="1163" id="album-logo" class="album-logo" alt="Two Of Us" draggable="false"></button></h1>
      <p id="album-subtitle"></p>
    </header>

    <section class="case-stage" aria-label="Estojo do álbum">
      <div class="jewel-case" id="jewel-case">
        <div class="case-base">
          <div class="tray-groove"></div>
          <button class="disc" id="disc" type="button" tabindex="-1" aria-hidden="true" aria-label="Reproduzir álbum" aria-pressed="false">
            <span class="disc-rotation" id="disc-rotation"><img width="701" height="701" id="disc-art" alt="" draggable="false"></span>
            <span class="disc-sheen"></span><span class="disc-hole"></span>
          </button>
          <span class="tray-hub"></span>
        </div>
        <div class="case-lid" id="case-lid">
          <div class="lid-face lid-front">
            <img width="1560" height="1580" id="cover-art" alt="Capa do álbum Two Of Us" draggable="false">
            <span class="plastic-shine"></span>
          </div>
          <div class="lid-face lid-inner">
            <button class="booklet-in-case" id="booklet-trigger" type="button" tabindex="-1" aria-hidden="true" aria-label="Retirar e abrir o livreto">
              <img width="1560" height="1580" id="booklet-art" alt="" draggable="false">
              <span class="booklet-edge"></span>
            </button>
            <span class="case-clip clip-top"></span><span class="case-clip clip-bottom"></span>
          </div>
        </div>
        <span class="case-spine"></span>
        <button class="case-open-hit" id="case-open" type="button" aria-label="Abrir estojo do álbum"></button>
      </div>
    </section>

    <section class="listening-panel open-only" id="listening-panel" hidden aria-label="Reprodução do álbum">
      <div class="tap-hints" aria-hidden="true">
        <svg class="tap-hint" viewBox="0 0 120 80" fill="none" focusable="false">
          <path d="M91 68C77 72 66 63 62 53S57 34 61 22L59 7M49 19L59 7 69 20"/>
          <path class="sketch-echo" d="M88 71C75 70 64 63 60 51M57 9L51 18"/>
        </svg>
        <svg class="tap-hint" viewBox="0 0 120 80" fill="none" focusable="false">
          <path d="M29 70C43 73 55 61 57 50S54 31 58 21L60 7M48 18L60 7 68 21"/>
          <path class="sketch-echo" d="M32 73C43 72 55 63 59 52M62 9L69 20"/>
        </svg>
      </div>
      <div class="disc-progress" aria-hidden="true"><span id="disc-progress-fill"></span></div>
      <div class="session-footer"><span id="disc-time">00:00</span><button id="case-close" class="case-close-control" type="button" aria-label="Fechar estojo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
      <p id="disc-error" class="error-message" role="status"></p>
    </section>
    <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>
  </main>

  <dialog id="polaroid-dialog" class="polaroid-dialog" aria-label="Detalhes do disco" aria-describedby="polaroid-notes">
    <div class="polaroid-stage">
      <div class="polaroid-print">
        <div class="polaroid-photo"><img width="900" height="900" id="polaroid-photo" alt="Fotografia do disco" draggable="false" hidden></div>
        <div class="polaroid-notes" id="polaroid-notes"></div>
      </div>
      <button id="polaroid-close" class="polaroid-close" type="button" aria-label="Fechar detalhes do disco" autofocus>×</button>
    </div>
  </dialog>

  <dialog id="booklet-dialog" class="booklet-dialog" aria-labelledby="booklet-label">
    <div class="reader-layout">
      <div class="reader-heading"><span id="booklet-label">ENTRE AS PÁGINAS</span><button class="icon-button reader-close" id="booklet-close" type="button" aria-label="Guardar livreto">×</button></div>
      <div class="book-shell" id="book-shell">
        <div class="page-underlay"></div>
        <article class="book-page" id="book-page" tabindex="-1"></article>
        <div class="page-turn-shadow" id="page-turn-shadow" aria-hidden="true" hidden></div>
        <div class="turning-leaf" id="turning-leaf" aria-hidden="true" hidden></div>
        <div class="reader-cover" id="reader-cover"><img width="1560" height="1580" id="reader-cover-art" alt="" draggable="false"></div>
      </div>
      <nav class="page-navigation" aria-label="Navegação do livreto">
        <button class="icon-button" id="page-prev" type="button" aria-label="Página anterior">←</button>
        <span id="page-counter" aria-live="polite"></span>
        <button class="icon-button" id="page-next" type="button" aria-label="Próxima página">→</button>
      </nav>
      <p class="reader-hint">Deslize ou toque nas bordas para virar.</p>
    </div>
  </dialog>

  <template id="bonus-player-template">
    <section class="bonus-player" aria-label="Player da faixa extra">
      <div class="bonus-cassette">
        <img class="bonus-cassette-body" src="assets/img/cassette.webp" alt="" draggable="false" width="936" height="624">
        <div class="bonus-identity"><h3 class="bonus-title"></h3><p class="bonus-artist"></p></div>
        <svg class="bonus-reel bonus-reel-left" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <circle class="bonus-reel-rim" cx="50" cy="50" r="46"/>
          <path class="bonus-reel-spokes" d="M44 5h12v24H44z"/>
          <g class="bonus-reel-spokes"><path d="M44 5h12v24H44z" transform="rotate(60 50 50)"/><path d="M44 5h12v24H44z" transform="rotate(120 50 50)"/><path d="M44 5h12v24H44z" transform="rotate(180 50 50)"/><path d="M44 5h12v24H44z" transform="rotate(240 50 50)"/><path d="M44 5h12v24H44z" transform="rotate(300 50 50)"/></g>
          <circle class="bonus-reel-center" cx="50" cy="50" r="15"/>
        </svg>
        <svg class="bonus-reel bonus-reel-right" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <circle class="bonus-reel-rim" cx="50" cy="50" r="46"/>
          <path class="bonus-reel-spokes" d="M44 5h12v24H44z"/>
          <g class="bonus-reel-spokes"><path d="M44 5h12v24H44z" transform="rotate(60 50 50)"/><path d="M44 5h12v24H44z" transform="rotate(120 50 50)"/><path d="M44 5h12v24H44z" transform="rotate(180 50 50)"/><path d="M44 5h12v24H44z" transform="rotate(240 50 50)"/><path d="M44 5h12v24H44z" transform="rotate(300 50 50)"/></g>
          <circle class="bonus-reel-center" cx="50" cy="50" r="15"/>
        </svg>
      </div>
      <div class="bonus-controls">
        <button class="icon-button bonus-previous" type="button" aria-label="Anterior: reiniciar faixa extra"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 5l-10 7 10 7z"/></svg></button>
        <button class="bonus-toggle" type="button" aria-label="Reproduzir faixa extra" aria-pressed="false"><span class="play-icon" aria-hidden="true">▶</span><span class="pause-icon" aria-hidden="true">Ⅱ</span></button>
        <button class="icon-button bonus-next" type="button" aria-label="Próxima: repetir única faixa extra"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 5l10 7-10 7z"/></svg></button>
      </div>
      <label class="sr-only" for="bonus-seek">Posição da faixa extra</label>
      <input id="bonus-seek" class="bonus-seek" type="range" min="0" max="100" value="0" step="0.1" disabled>
      <div class="bonus-times"><span class="bonus-elapsed">00:00</span><span class="bonus-duration">00:00</span></div>
      <p class="bonus-error error-message" role="status"></p>
    </section>
  </template>
  <audio id="disc-audio" preload="none"></audio>
  <audio id="bonus-audio" preload="none"></audio>
  <noscript><style>.headphones-gate { display: none; } .headphones-pending .experience { visibility: visible; }</style><p class="noscript-message">Ative o JavaScript para abrir o estojo e explorar o álbum.</p></noscript>
</body>
</html>
